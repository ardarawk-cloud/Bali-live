<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="transparent" />
  <title>Bali Live Playlist Dock</title>
  <link rel="stylesheet" href="./playlist.css?v=1.7.2" />
</head>
<body>
  <main class="playlist-stage">
    <section class="playlist-shell" aria-label="Playlist dock">
      <span class="corner corner-tl"></span>
      <span class="corner corner-tr"></span>
      <span class="corner corner-bl"></span>
      <span class="corner corner-br"></span>

      <header class="playlist-header">
        <span class="meter-bars left" aria-hidden="true"></span>
        <div class="playlist-title">PLAYLIST</div>
        <span class="meter-bars right" aria-hidden="true"></span>
      </header>

      <div class="playlist-empty" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>
